<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FlowCraft</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/* VOICE: bright, cosy blocky survival world - a game you want to open every morning
   IDEA: your studies are a living voxel world: quests, ore, chests that oxidise, a copper helper that sorts your courses
   PICTURE: day/night sky over a biome, textured plank/copper/deepslate panels, HUD with hearts + XP + hotbar
   COLOUR/TYPE: biome-driven (Dappled Forest autumn by default), lapis/redstone/amethyst/gold accents; Pixelify Sans + Press Start 2P
   LAYOUT: grass-block header, one working view, HUD hotbar on a grass strip at the bottom */
:root{--paper:#fff6e6;--ink:#2e1d10;--acc:#e8651e;--sky1:#7ec3ff;--sky2:#cfe9ff;--hud:#fff}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:90px}
body{margin:0;font:18px/1.4 'Pixelify Sans',system-ui,sans-serif;color:var(--ink);min-height:100vh;padding-bottom:200px;overflow-x:clip;background:#000}
#sky{position:fixed;inset:0;z-index:-3;background:linear-gradient(var(--sky1),var(--sky2));transition:background 2s}
#sun{position:fixed;width:64px;height:64px;z-index:-2;image-rendering:pixelated;transition:all 2s}
.cloud{position:fixed;height:22px;background:#fff;opacity:.9;z-index:-2;box-shadow:0 6px 0 rgba(0,0,0,.06);animation:drift linear infinite}
.cloud:before{content:"";position:absolute;left:22%;top:-14px;width:46%;height:16px;background:inherit}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:-1;overflow:hidden}
#fx i{position:absolute;top:-20px;width:8px;height:8px;animation:fall linear infinite}
@keyframes fall{to{transform:translate(60px,110vh) rotate(540deg)}}
#ground{position:fixed;left:0;right:0;bottom:0;height:70px;z-index:5;background:var(--t-grassside) repeat-x 0 0/64px 64px,var(--t-dirt) repeat 0 0/64px 64px;image-rendering:pixelated;border-top:3px solid rgba(0,0,0,.35)}
h1,h2,h3{font-weight:700;margin:0}
h1{font-size:clamp(26px,4vw,40px);line-height:1.08;color:#fff;text-shadow:3px 3px 0 #000,0 0 18px rgba(0,0,0,.35);text-wrap:balance}
h2{font-size:22px;margin-bottom:10px}
h3{font-size:18px;margin-bottom:6px}
p{margin:6px 0}
a{color:#1f56c8}
.wrap{max-width:1200px;margin:0 auto;padding:16px max(3vw,12px)}
.logo{font-family:'Press Start 2P',monospace;font-size:clamp(16px,2.4vw,22px);color:#d8d8d8;text-shadow:1px 1px 0 #7a7a7a,2px 2px 0 #5a5a5a,3px 3px 0 #3a3a3a,4px 4px 0 #111;white-space:nowrap;letter-spacing:1px}
.logo b{color:#ffd83d;text-shadow:1px 1px 0 #b78a00,2px 2px 0 #8a6800,3px 3px 0 #5a4300,4px 4px 0 #111;font-weight:400}
.splash{font-family:'Press Start 2P';font-size:13px;color:#ffff3f;text-shadow:2px 2px #3f3f00;transform:rotate(-12deg);display:inline-block;animation:pulse .5s ease-in-out infinite alternate;white-space:nowrap}
@keyframes pulse{to{transform:rotate(-12deg) scale(1.08)}}
/* panels */
.panel{position:relative;background:var(--paper);color:var(--ink);border-style:solid;border-width:10px;border-image-source:var(--t-oak);border-image-slice:5;border-image-repeat:round;box-shadow:0 0 0 3px #1a120a,6px 8px 0 3px rgba(0,0,0,.22);padding:14px 16px;image-rendering:pixelated}
.panel.stone{border-image-source:var(--t-cobble);background:#eef0f4}
.panel.copper{border-image-source:var(--t-copper);background:#fff0e6}
.panel.dark{border-image-source:var(--t-deep);background:#1d2030;color:#f2f2f2}
.panel.ench{border-image-source:var(--t-amethyst);background:#f6eeff}
.panel.leaf{border-image-source:var(--t-leaf);background:#fbfff2}
.panel.gold{border-image-source:var(--t-goldb);background:#fffbe6}
.panel.dark a{color:#8fd3ff}
.btn{font:600 18px/1 'Pixelify Sans',sans-serif;color:#fff;text-shadow:2px 2px 0 rgba(0,0,0,.45);background:#7b7f8a;border:3px solid #111;box-shadow:inset 3px 3px 0 rgba(255,255,255,.35),inset -3px -4px 0 rgba(0,0,0,.3);padding:9px 14px;min-height:44px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;justify-content:center;white-space:nowrap;text-decoration:none}
.btn:hover{filter:brightness(1.15)}
.btn:active{transform:translateY(2px)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.slot:focus-visible{outline:3px solid #ffff3f;outline-offset:2px}
.btn.go{background:#3faa36}.btn.red{background:#c8322b}.btn.cu{background:#d9733f}.btn.ench{background:#8e4fd6}.btn.blue{background:#3b63d8}
.btn.gold{background:#f0b81c;color:#3a2a00;text-shadow:1px 1px 0 rgba(255,255,255,.4)}
.btn.sm{font-size:16px;min-height:38px;padding:6px 10px}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none;filter:none}
input,select,textarea{font:500 17px 'Pixelify Sans',sans-serif;background:#1b1b1f;color:#fff;border:3px solid #8a8a8a;padding:7px 9px;min-height:44px;width:100%;border-radius:0}
input::placeholder,textarea::placeholder{color:#9a9aa5}
textarea{min-height:150px;resize:vertical;line-height:1.3}
input:focus,select:focus,textarea:focus{border-color:#fff}
input[type=checkbox]{width:24px;min-height:24px;accent-color:#3faa36}
label{display:block;margin:12px 0 4px;font-weight:600}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.muted{opacity:.72}.small{font-size:16px}
.stack{display:grid;gap:14px}
.split{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}
.vtitle{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;justify-content:space-between;margin:6px 0 16px}
.vtitle p{color:#fff;text-shadow:2px 2px 0 #000;font-size:18px;margin:4px 0 0}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:14px;font-weight:600;padding:3px 7px;border:2px solid #111;color:#fff;background:#555;white-space:nowrap}
.chip.learn{background:#3b63d8}.chip.practice{background:#c8322b}.chip.revise{background:#8e4fd6}.chip.test{background:#e3a812;color:#2a1f00}
.chip.free{background:#3faa36}.chip.paid{background:#b5651d}.chip.lt{background:#eee;color:#222}
/* header */
header.top{position:sticky;top:0;z-index:20;background:var(--t-grassside) repeat-x 0 0/64px 64px,var(--t-dirt) repeat 0 0/64px 64px;image-rendering:pixelated;border-bottom:3px solid #000;color:#fff;text-shadow:2px 2px 0 #000}
.topin{max-width:1200px;margin:0 auto;padding:18px max(3vw,12px) 10px;display:flex;gap:14px 22px;align-items:center;flex-wrap:wrap}
.who{flex:1 1 200px;display:flex;align-items:center;gap:12px}
.who .face{width:40px;height:40px;border:3px solid #000;background:#222;flex:none}
.cur{display:flex;gap:6px 14px;flex-wrap:wrap}
.cur span{display:inline-flex;align-items:center;gap:5px;font-size:20px;font-weight:700;white-space:nowrap}
/* HUD */
.hud{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);z-index:30;display:grid;justify-items:center;gap:4px}
.hearts{display:flex;gap:2px;align-self:start;justify-self:start}
.xpbar{width:100%;height:12px;background:#111;border:2px solid #000;position:relative}
.xpbar i{display:block;height:100%;background:linear-gradient(#c6ff6a,#5fbf1f)}
.xpbar b{position:absolute;left:50%;top:-17px;transform:translateX(-50%);font:14px 'Press Start 2P';color:#80ff20;text-shadow:2px 0 #000,-2px 0 #000,0 2px #000,0 -2px #000;font-weight:400}
.hotbar{display:flex;background:rgba(20,20,20,.6);border:3px solid #000;padding:3px}
.hotbar button{width:62px;height:62px;border:0;background:rgba(139,139,139,.85);box-shadow:inset 3px 3px 0 #373737,inset -3px -3px 0 #d6d6d6;cursor:pointer;display:grid;place-items:center;position:relative;padding:0}
.hotbar button.on{outline:4px solid #fff;outline-offset:-2px;z-index:1;background:rgba(170,170,170,.95)}
.hotbar button b{position:absolute;right:4px;bottom:1px;font:600 14px 'Pixelify Sans';color:#fff;text-shadow:1px 1px #000}
.hlabel{font:600 16px 'Pixelify Sans';color:#fff;text-shadow:2px 2px #000;white-space:nowrap}
/* tooltip */
.tip{position:fixed;z-index:80;background:#100010f0;border:2px solid #2a0a5e;outline:2px solid #100010;color:#fff;padding:6px 9px;font-size:16px;pointer-events:none;max-width:280px}
/* quests */
.qbar{height:22px;background:#111;border:3px solid #000;margin-top:8px}
.qbar i{display:block;height:100%;background:repeating-linear-gradient(90deg,#4ee6dc 0 14px,#2fbfb5 14px 16px)}
.quests{display:grid;gap:12px}
.q{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;align-items:center;border-left-width:16px}
.q.learn{border-image-source:var(--t-lapis)}.q.practice{border-image-source:var(--t-redstone)}.q.revise{border-image-source:var(--t-amethyst)}.q.test{border-image-source:var(--t-goldb)}
.slot{background:#8b8b8b;box-shadow:inset 3px 3px 0 #373737,inset -3px -3px 0 #fff;display:grid;place-items:center;width:64px;height:64px;position:relative;flex:none}
.q .tt{font-size:22px;font-weight:700;line-height:1.15}
.q .meta{display:flex;gap:6px 12px;flex-wrap:wrap;font-size:16px;align-items:center;margin-top:4px}
.q .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.q details{grid-column:2/4;font-size:17px}
.q summary{cursor:pointer;color:#1f56c8;font-weight:600;width:max-content;max-width:100%}
.how{white-space:pre-wrap;background:#f1e3c6;border:3px solid #c9a46a;padding:8px 10px;margin-top:6px}
.q.done{opacity:.8}.q.done .tt{text-decoration:line-through;text-decoration-thickness:3px}
.q.doing{background:#e9ffe0}
.q.missed,.q.skipped,.q.rested{opacity:.55}
.timer{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;margin-bottom:14px}
.timer .big{font-family:'Press Start 2P';font-size:clamp(26px,6vw,46px);color:#80ff20;text-shadow:4px 4px #000;margin:8px 0}
.tprog{height:12px;background:#000;border:2px solid #555;max-width:460px}.tprog i{display:block;height:100%;background:#80ff20}
/* modal & toasts */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:60;padding:12px}
.modal{width:min(680px,100%);max-height:92vh;overflow:auto}
.modal.wide{width:min(940px,100%)}
.toasts{position:fixed;top:90px;right:12px;display:grid;gap:8px;z-index:70;width:min(340px,calc(100vw - 24px))}
.toast{background:#212121;color:#fff;border:3px solid #000;box-shadow:inset 3px 3px 0 #555,inset -3px -3px 0 #111;padding:10px 12px;animation:slide .3s steps(4);display:flex;gap:10px;align-items:center}
.toast b{display:block;color:#ffff3f;font-weight:700}
.toast.advt b{color:#c27bff}
@keyframes slide{from{transform:translateX(110%)}}
.chestwrap{display:grid;place-items:center;padding:6px 0}
.chestbig{overflow:visible}.chestbig .lid{transform-box:fill-box;transform-origin:0 100%;transition:transform .55s steps(6)}
.chestbig.open .lid{transform:translate(0,-1px) rotate(-24deg)}
.loot{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:10px 0;min-height:70px}
.loot .slot{width:72px;height:72px;animation:pop .45s steps(4) backwards}
.loot .slot b{position:absolute;right:4px;bottom:0;color:#fff;text-shadow:2px 2px #3f3f3f;font-size:22px}
@keyframes pop{from{transform:scale(0) translateY(30px)}}
/* chests */
.subs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.subc{cursor:pointer;text-align:left;font:inherit;display:grid;gap:6px;width:100%}
.subc:hover{transform:translateY(-3px)}
.subc .nm{font-size:20px;font-weight:700}
.mini{height:12px;background:#333;border:2px solid #000}.mini i{display:block;height:100%;background:#3faa36}
.tbl{width:100%;border-collapse:collapse;font-size:17px}
.tbl td,.tbl th{padding:6px;border-bottom:2px solid #d6c3a0;text-align:left;vertical-align:middle}
.tbl th{font-size:15px}
.tbl td.n{text-align:right;white-space:nowrap}
.tbl select{min-height:38px;font-size:16px;padding:2px 4px}
/* armory */
.armory{display:grid;grid-template-columns:minmax(230px,340px) minmax(0,1fr);gap:16px;align-items:start}
.hero{display:grid;place-items:center;padding:20px 0 0;position:relative;overflow:hidden;background:linear-gradient(var(--sky1),var(--sky2))}
.hero .gr{width:100%;height:56px;background:var(--t-grassside) repeat-x 0 0/48px 48px;image-rendering:pixelated;margin-top:-6px}
.hero svg{filter:drop-shadow(6px 6px 0 rgba(0,0,0,.3));position:relative;z-index:1}
.glint{animation:glint 2.4s steps(8) infinite;mix-blend-mode:screen}
@keyframes glint{0%,100%{opacity:0}50%{opacity:.55}}
.piece{display:grid;grid-template-columns:64px minmax(0,1fr);gap:8px 12px;align-items:center;padding:10px 0;border-bottom:2px solid #d6c3a0}
.piece>.row{grid-column:1/-1}
.enchl{color:#7a2bd6;font-weight:600}
.trade{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-bottom:2px dashed #d6c3a0}
/* stats */
.heat{display:grid;grid-template-columns:repeat(19,minmax(0,1fr));gap:3px}
.heat div{aspect-ratio:1;border:2px solid #000}
.heat span{font-size:14px;text-align:center;display:block}
.bars{display:grid;gap:6px}
.bar{display:grid;grid-template-columns:120px minmax(0,1fr) 70px;gap:8px;align-items:center;font-size:17px}
.bar .tr{height:20px;background:#555;border:2px solid #000}.bar .tr i{display:block;height:100%}
.bar .n{text-align:right;white-space:nowrap}
.cols{display:flex;align-items:flex-end;gap:4px;height:150px;border-bottom:3px solid #000;padding-top:10px}
.cols div{flex:1;background:#4ee6dc;border:2px solid #000;border-bottom:0;min-height:2px}
.cols div.today{background:#ffd83d}
.colsl{display:flex;gap:4px;font-size:14px}.colsl span{flex:1;text-align:center}
.advs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.adv{display:flex;gap:8px;align-items:center;padding:6px;border:2px solid #d6c3a0;background:#fff}
.adv.off{opacity:.45;filter:grayscale(1)}
/* helper & library */
.chat{display:grid;gap:8px;max-height:420px;overflow:auto;padding:4px}
.msg{padding:8px 10px;border:3px solid #111;white-space:pre-wrap;max-width:92%}
.msg.me{justify-self:end;background:#dff1ff}
.msg.ai{justify-self:start;background:#fff0e6;border-color:#a54f2a}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{display:grid;gap:6px;align-content:start}
.card .shelf{height:26px;margin:-14px -16px 6px;background:var(--t-books) repeat-x 0 0/48px 48px;image-rendering:pixelated;border-bottom:3px solid #3a2410}
.card h3{font-size:19px}
.pick{background:#ffd83d;color:#2a1f00;border:2px solid #111;font-weight:700;font-size:14px;padding:2px 6px}
.plan{display:grid;gap:12px}
.intent{font-size:19px;font-weight:600;background:#fff;border:3px dashed #d9733f;padding:10px}
.steps{display:flex;gap:6px;margin-bottom:12px}.steps i{flex:1;height:10px;background:#555;border:2px solid #000}.steps i.on{background:#3faa36}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.theme{border:3px solid #111;padding:0;cursor:pointer;background:#fff;font:inherit;text-align:left}
.theme.on{outline:4px solid #ffd83d}
.theme .sw{height:58px;image-rendering:pixelated}
.theme span{display:block;padding:6px 8px;font-weight:700}
.filters{display:grid;grid-template-columns:2fr repeat(4,minmax(0,1fr));gap:10px}
@media(max-width:860px){.filters{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.filters input{grid-column:1/-1}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
body{font-weight:500}
.panel{background-image:linear-gradient(rgba(255,255,255,.45),rgba(255,255,255,0) 60px);box-shadow:0 0 0 3px #1a120a,0 8px 0 3px rgba(0,0,0,.3),0 18px 28px rgba(0,0,0,.28)}
.panel.dark{background-image:linear-gradient(rgba(255,255,255,.06),rgba(255,255,255,0) 60px)}
.vtitle{background:rgba(14,11,8,.7);border:3px solid #000;box-shadow:inset 0 0 0 2px rgba(255,255,255,.1),0 8px 0 rgba(0,0,0,.3);padding:14px 18px}
.vtitle p{color:#f3ead8;text-shadow:1px 1px 0 #000}
.q .meta{color:#3b2a1a}
.q.task{border-image-source:var(--t-copper)}
.chip.task{background:#18a0a8}
.topnav{display:none;flex:1 1 100%;gap:4px;overflow-x:auto;padding-top:4px}
.topnav button{display:inline-flex;align-items:center;gap:6px;font:600 16px 'Pixelify Sans',sans-serif;color:#fff;text-shadow:2px 2px 0 #000;background:rgba(0,0,0,.35);border:2px solid rgba(0,0,0,.6);padding:5px 10px;cursor:pointer;white-space:nowrap;min-height:38px}
.topnav button.on{background:rgba(255,255,255,.22);border-color:#fff}
.topnav button:hover{background:rgba(255,255,255,.15)}
@media(min-width:1100px){.topnav{display:flex;order:3}}
.flowgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
.flowmain{display:grid;gap:10px}
.fchat{min-height:280px;max-height:52vh;overflow:auto;padding:4px;display:grid;gap:8px;align-content:start}
.fchat .msg{color:#1f140a}
.cmdbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:stretch}
.cmdbar textarea{min-height:72px;font-size:18px}
.cmdbtns{display:grid;gap:8px;align-content:stretch}
.mic.on{background:#c8322b;animation:pulse2 1s steps(2) infinite}
@keyframes pulse2{50%{filter:brightness(1.35)}}
.receipt{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:6px 8px;border:2px solid #111;background:#fff;margin-top:6px;color:#1f140a}
.weekmini{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:8px}
.wm{font:600 14px 'Pixelify Sans';display:grid;gap:2px;justify-items:center;padding:6px 2px;border:2px solid #111;background:#fff;cursor:pointer;min-height:52px}
.wm span{font-size:20px}.wm.on{background:#ffd83d}
.week{display:grid;grid-template-columns:repeat(7,minmax(185px,1fr));gap:10px;overflow-x:auto;padding:10px 2px 8px;scroll-snap-type:x mandatory}
.wday{scroll-snap-align:start;background:rgba(255,255,255,.6);border:3px solid #6b4f2a;padding:8px;min-height:180px;display:flex;flex-direction:column}
.wday.on{background:#fff8d6;border-color:#e3a812}
.wt{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;border:2px solid #111;border-left-width:8px;background:#fff;margin-top:6px;padding:4px 6px}
.wt.learn{border-left-color:#3b63d8}.wt.practice{border-left-color:#c8322b}.wt.revise{border-left-color:#8e4fd6}.wt.test{border-left-color:#e3a812}.wt.task{border-left-color:#18a0a8}
.wt.done{opacity:.6}.wt.done .wtb span:last-child{text-decoration:line-through}.wt.missed,.wt.skipped,.wt.rested{opacity:.45}
.wtb{flex:1 1 140px;display:grid;gap:2px;text-align:left;font:500 16px 'Pixelify Sans',sans-serif;background:none;border:0;padding:4px 0;cursor:pointer;color:#1f140a;min-height:44px}
@media(max-width:860px){.flowgrid{grid-template-columns:minmax(0,1fr)}.fchat{max-height:42vh;min-height:140px}.flowmain .cmdbar{order:-2}.flowmain .fchips{order:-1}}
@media(max-width:600px){.cmdbar{grid-template-columns:minmax(0,1fr)}.cmdbtns{grid-template-columns:1fr 1fr}.hotbar button{width:38px;height:38px}.hotbar button svg{width:24px;height:auto}.hotbar button b{font-size:12px}.topin{padding-top:16px}}
@media (orientation:landscape) and (max-height:520px){
 header.top{position:static}.topin{padding:14px 12px 6px;gap:6px 14px}.splash,.who .face{display:none}
 .hud{left:6px;top:50%;bottom:auto;transform:translateY(-50%);gap:0}
 .hud .hearts,.hud .xpbar,.hud .hlabel{display:none}
 .hotbar{flex-direction:column;padding:2px}
 .hotbar button{width:38px;height:38px}.hotbar button svg{width:24px;height:auto}.hotbar button b{display:none}
 #ground{display:none}
 body{padding-bottom:24px;padding-left:56px}
 .wrap{padding-top:10px}h1{font-size:24px}.vtitle{padding:10px 14px;margin-bottom:12px}

function rng(seed){let s=seed%2147483647;if(s<=0)s+=2147483646;return()=>(s=s*16807%2147483647)/2147483647}
function hsh(str){let h=7;for(const c of str)h=(h*31+c.charCodeAt(0))>>>0;return h||1}

 const put=(x,y,col)=>{g.fillStyle=col;g.fillRect(x,y,1,1)};const pick=()=>P[Math.floor(r()*P.length)];
 for(let y=0;y<16;y++)for(let x=0;x<16;x++){
  let col=pick();
  if(kind==='planks'){const band=Math.floor(y/4);col=[P[0],P[1],P[0],P[2]][band];if(y%4===3)col=P[3];if((x+band*5)%8===7&&y%4!==3)col=P[3];if(r()<.12)col=P[2]}
  if(kind==='grassside'){const edge=3+((x*7+3)%3===0?1:0)+(x%5===0?1:0);col=y<edge?P[Math.floor(r()*4)]:P[4+Math.floor(r()*3)];if(y===edge&&r()<.4)col=P[1]}
  if(kind==='cobble'){const cell=((Math.floor((x+(Math.floor(y/5)%2)*3)/5))+Math.floor(y/5))%3;col=P[cell];if(x%5===0||y%5===0)col=P[3];if(r()<.15)col=P[4]||P[0]}
  if(kind==='copper'){col=P[Math.floor(r()*3)];if(x===0||y===0)col=P[3];if(x===15||y===15)col=P[4];if((x===7||y===7)&&r()<.5)col=P[4]}
  if(kind==='books'){if(y<2||y>13)col=P[0];else if(y===2||y===13)col=P[1];else{const b=Math.floor(x/2);col=P[2+(b*3+(y>7?1:0))%5];if(x%2===1&&r()<.25)col='#1b1b1b'}}

  sub.topics.forEach(tp=>{if(tp.status!=='new'&&tp.next&&tp.next<=k)C.push({type:'revise',sub,tp,score:w*(1.5+Math.min(daysBetween(tp.next,k),7)*.12)})});
  sub.topics.filter(t=>t.status==='learning').slice(0,2).forEach(tp=>C.push({type:'practice',sub,tp,score:w*1.25*(1+(60-tp.conf)/200)}));
  const nw=sub.topics.filter(t=>t.status==='new');if(nw[0])C.push({type:'learn',sub,tp:nw[0],score:w*1.1});if(nw[1])C.push({type:'learn',sub,tp:nw[1],score:w*.6});

 const best={};C.forEach(c=>{const key=c.tp?c.tp.id:c.sub.id+c.type;if(!best[key]||best[key].score<c.score)best[key]=c});C=Object.values(best);

 while(left>=15&&C.length&&out.length+keep.length<9){C.forEach(c=>c.e=c.score*Math.pow(.55,cnt[c.sub.id]||0));C.sort((a,b)=>b.e-a.e);

function assignSlots(tasks,k,fixed){
 const P=S.profile,eff=effCurve();let st=P.start*60,en=P.end*60;if(en<=st)en=st+12*60;
 if(k===dkey())st=Math.max(st,Math.ceil((nowMin()+5)/15)*15);
 const occ=fixed.filter(t=>t.slot!=null&&t.status!=='done').map(t=>[t.slot,t.slot+t.mins+10]).concat((S.busy&&S.busy[k]||[]).map(b=>[b.s-10,b.e+10]));
 [...tasks].sort((a,b)=>DIFF[b.type]-DIFF[a.type]||b.mins-a.mins).forEach(t=>{let bS=null,bV=-1;
  for(let s=st;s+t.mins<=en;s+=15){if(occ.some(([a,b])=>s<b&&s+t.mins+10>a))continue;let v=0,n=0;for(let m=s;m<s+t.mins;m+=15){v+=eff[Math.floor(m/60)%24];n++}v=v/n-(s-st)/60*.002;if(v>bV){bV=v;bS=s}}
  t.slot=bS;if(bS!=null)occ.push([bS,bS+t.mins+10])});
}
function howTo(type,sub,tp){const T=tp?tp.name:sub.name;return ({
 learn:`1. Skim ${T} first (headings, diagrams, summary) - 3 min.\n2. Study it in focused blocks; write short notes in your own words.\n3. Close everything and write the 5 key ideas from memory (active recall).\n4. Re-check the source and mark what you missed - that's your revision list.\n5. Try 3 easy questions to confirm it clicked.`,
 practice:`1. Pick 15-20 questions on ${T}, easy to hard.\n2. Set the timer, solve without notes.\n3. Check immediately; log your score when you stop.\n4. Redo every wrong question from scratch - no peeking.\n5. Note the mistake type (concept / careless / time).`,
 revise:`1. Blank page: write everything you remember about ${T} (10 min, no notes).\n2. Open your notes and fill gaps in a different colour.\n3. Make 3 flashcards from the gaps.\n4. Finish with 3 quick questions.`,
 test:`1. Mixed timed test on ${sub.name}: past paper or chapter-end exercises.\n2. Exam conditions - no notes, no phone.\n3. Mark it honestly and enter the % when you stop.\n4. List the 3 weakest topics; the planner pushes them up.`})[type]}
function srcFor(type,sub){const own=(sub.sources||'').trim();
 const def={learn:'Your textbook chapter + one lecture video on it (try the Library tab for free courses)',practice:'Textbook exercises, then past-year or sample-paper questions',revise:'Your own notes and flashcards',test:'A past-year paper or a full chapter-end exercise set'}[type];
 if(!own)return def;const parts=own.split(/[;,\n]/).map(s=>s.trim()).filter(Boolean);
 return ({learn:parts[0],practice:parts[1]||parts[0],revise:'Your notes'+(parts[0]?' + '+parts[0]:''),test:parts[parts.length-1]||parts[0]})[type]+(type==='practice'||type==='test'?' - questions section':'')}

function hit(reason){
 const ps=PIECES.map(p=>p[0]).filter(k=>S.armor[k].t>0||S.armor[k].prot>0);
 if(!ps.length){if(S.inv.dia>0){S.inv.dia--;evt(`${reason} - lost 1 diamond`)}else evt(`${reason} - nothing left to lose`);return}
 ps.sort((a,b)=>(S.armor[b].t*4+S.armor[b].prot)-(S.armor[a].t*4+S.armor[a].prot));
 const k=ps[0],a=S.armor[k],nm=PIECES.find(p=>p[0]===k)[1];
 if(a.prot>0){a.prot--;evt(`${reason} - Protection on your ${nm} absorbed it`)}else{a.t--;evt(`${reason} - ${nm} cracked ${TIERS[a.t+1][0]} → ${TIERS[a.t][0]}`)}
}
function closeActive(){const A=S.active;if(!A)return;const t=(S.days[A.day]?.tasks||[]).find(x=>x.id===A.id);const e=Date.now();
 if(t){t.spent+=e-A.s;if(e-A.s>30000)S.log.push({id:t.id,sub:t.sub,type:t.type,s:A.s,e,f:null})}S.active=null}
function rollDay(){
 const k=dkey();let pen=0;if(S.active&&S.active.day!==k)closeActive();
 Object.keys(S.days).sort().forEach(d=>{const day=S.days[d];if(d>=k||day.settled)return;
  if(!day.rest)day.tasks.forEach(t=>{if(t.status==='todo'||t.status==='doing'){t.status='missed';hit(`Missed "${t.title}" (${d})`);pen++}});
  if(!day.perfect&&!day.rest)S.streak=0;day.settled=true});
 if(!S.days[k]&&S.subjects.length)S.days[k]={tasks:plan(k),settled:false,planned:true};
 else if(S.days[k]&&!S.days[k].planned&&S.subjects.length){S.days[k].tasks=plan(k,S.days[k].tasks);S.days[k].planned=true}
 if(pen){beep(SND.bad);setTimeout(()=>toast('Armor damaged',`${pen} unfinished quest${pen>1?'s':''} cracked your armor. See the Armory.`),600)}
 save();
}

function completeTask(id){
 const [t,k]=findTask(id);if(!t)return;const st=readFinish(t);const sub=subById(t.sub),tp=topById(sub,t.top);const mins=t.spent/6e4;
 S.log.forEach(L=>{if(L.id===t.id&&L.f==null)L.f=t.focus});memFromTask(t);
 if(tp){tp.mins+=mins;tp.last=k;if(t.score!=null)tp.conf=Math.round(tp.conf?tp.conf*.5+t.score*.5:t.score);
  if(t.type==='learn'){tp.status=st==='learning'?'learning':st==='mastered'?'mastered':'done';tp.reviews=0;tp.next=addDays(k,1)}
  else if(t.type==='practice'){if(st!=='learning'){tp.status=st==='mastered'?'mastered':'done';tp.next=addDays(k,2)}}
  else if(t.type==='revise'){if(st==='learning'){tp.status='learning';tp.reviews=0;tp.next=addDays(k,1)}else{tp.reviews++;tp.next=addDays(k,[1,3,7,14,30,60][Math.min(tp.reviews,5)]);if(st==='mastered')tp.status='mastered'}}
  tp.conf=Math.max(tp.conf,st==='mastered'?85:st==='understood'?60:25)}
 if(t.type==='test'&&t.score!=null&&sub)sub.score=Math.round(sub.score!=null?sub.score*.6+t.score*.4:t.score);
 if(mins>=5&&S.factor[t.type]!=null){const ratio=clamp(mins/t.mins,.5,2);S.factor[t.type]=+(S.factor[t.type]*.7+ratio*.3).toFixed(3)}
 const loot=[];const short=mins<Math.min(5,t.mins*.3);let dia=short?1:1+(t.mins>=40?1:0)+(t.focus>=4?1:0)+(t.type==='test'?1:0);
 const fort=PIECES.reduce((a,[p])=>a+S.armor[p].fort,0);let lucky=false;if(!short&&fort&&Math.random()<fort*.08){dia*=2;lucky=true}
 const xp=Math.round(Math.min(mins,t.mins*2));S.inv.dia+=dia;S.inv.xp+=xp;loot.push(['dia',dia]);if(xp>0)loot.push(['xp',xp]);
 if(!short){const cu=1+(t.type==='practice'?1:0);S.inv.cu+=cu;loot.push(['cu',cu])}

 t.status='done';t.loot=loot;
 const day=S.days[k];
 if(k===dkey()&&!day.perfect&&day.tasks.length&&day.tasks.every(x=>x.status==='done')){day.perfect=true;S.streak++;S.inv.eme++;loot.push(['eme',1]);

 chest(loot,short?'Short session - reduced loot. Time it with Start/Stop for full rewards.':lucky?'Fortune doubled your diamonds!':t.title,null,true);

const AI_LS='flowcraft_ai';
function aiCfg(){try{return JSON.parse(localStorage.getItem(AI_LS)||'null')}catch(e){return null}}
function freeSample(){let c=aiCfg();if(!window.claude&&location.protocol==='https:')c=Object.assign({url:'/api/ai',pass:''},c||{});if(c&&!c.url&&!window.claude)c.url='/api/ai';if(!c||!c.url)return null;
 const call=async body=>{let r;try{r=await fetch(c.url,{method:'POST',headers:{'content-type':'application/json','x-flowcraft-pass':c.pass||''},body:JSON.stringify(body)})}catch(e){throw {code:'network',message:'Could not reach your AI proxy'}}
  if(r.status===429)throw {code:'rate_limited'};if(!r.ok){let m='';try{m=(await r.json()).error}catch(e){}throw {code:'http_'+r.status,message:typeof m==='string'?m:JSON.stringify(m)}}return r.json()};
 return async(input,opts={})=>{const msgs=typeof input==='string'?[{role:'user',content:input}]:input.map(m=>({role:m.role,content:String(m.content||'')}));
  const tools=(opts.tools||[]).map(t=>({type:'function',function:{name:t.name,description:t.description,parameters:t.inputSchema||{type:'object',properties:{}}}}));
  for(let i=0;i<8;i++){const body={messages:msgs,max_tokens:1800,temperature:.3};if(tools.length)body.tools=tools;
   const j=await call(body);const m=j&&j.choices&&j.choices[0]&&j.choices[0].message;if(!m)throw {code:'bad_response'};
   if(m.tool_calls&&m.tool_calls.length){msgs.push({role:'assistant',content:m.content||'',tool_calls:m.tool_calls});
    for(const tc of m.tool_calls){const t=(opts.tools||[]).find(x=>x.name===tc.function.name);let out;
     try{const args=JSON.parse(tc.function.arguments||'{}');out=t?await t.execute(args):'unknown tool'}catch(e){out='error: '+(e&&e.message||e)}
     msgs.push({role:'tool',tool_call_id:tc.id,content:(typeof out==='string'?out:JSON.stringify(out)).slice(0,12000)})}continue}
   const text=m.content||'';opts.onText&&opts.onText({text,delta:text});return {text,truncated:false}}
  return {text:'I stopped after too many steps - check your tasks.',truncated:true}}}

function parseRaw(txt){
 const subs=[],goals=[];let cur=null;
 txt.split('\n').forEach(line=>{let l=line.trim();if(!l)return;
  const gm=l.match(/^goals?\s*[:\-]\s*(.+)$/i);if(gm){const d=gm[1].match(/(\d{4}-\d{2}-\d{2})/);goals.push({text:gm[1].replace(/\s*(by|before)?\s*\d{4}-\d{2}-\d{2}/i,'').trim(),subject:null,deadline:d?d[1]:null});return}
  const bullet=/^([-*•]|\d+[.)])\s*/.test(l);
  if(!bullet&&l.includes(':')){let [name,...rest]=l.split(':');rest=rest.join(':');let score=null;const sm=name.match(/(\d{1,3})\s*%/)||name.match(/\((\d{1,3})\)/);if(sm){score=+sm[1];name=name.replace(sm[0],'')}
   name=name.replace(/[()\-–]+\s*$/,'').replace(/[()]/g,'').trim();const rm=rest.match(/^\s*(\d{1,3})\s*%\s*$/);if(rm){score=+rm[1];rest=''}
   cur={name,score,topics:rest.split(/[,;|]/).map(s=>s.trim()).filter(Boolean),sources:''};subs.push(cur);return}
  if(cur)cur.topics.push(l.replace(/^([-*•]|\d+[.)])\s*/,''));else{cur={name:l,score:null,topics:[],sources:''};subs.push(cur)}});
 return {subjects:subs,goals};
}
function mergeData(data,target){
 const T=target||S;let ns=0,nt=0,ng=0;
 (data.subjects||[]).forEach(d=>{const name=String(d.name||'').trim();if(!name)return;let s=T.subjects.find(x=>x.name.toLowerCase()===name.toLowerCase());
  if(!s){s={id:uid(),name,score:null,sources:'',topics:[]};T.subjects.push(s);ns++}
  if(d.score!=null&&!isNaN(+d.score))s.score=clamp(+d.score,0,100);if(d.sources&&!s.sources)s.sources=String(d.sources);if(d.priority)s.priority=String(d.priority);
  (d.topics||[]).forEach(tn=>{tn=String(tn).trim();if(tn&&!s.topics.some(t=>t.name.toLowerCase()===tn.toLowerCase())){s.topics.push(newTopic(tn));nt++}})});
 (data.goals||[]).forEach(g=>{if(!g.text)return;const s=g.subject&&T.subjects.find(x=>x.name.toLowerCase()===String(g.subject).toLowerCase());T.goals.push({id:uid(),text:String(g.text),subj:s?s.id:'',deadline:/^\d{4}-\d{2}-\d{2}$/.test(g.deadline||'')?g.deadline:'',done:false,fromParse:!!target});ng++});
 return `Added ${ns} subjects, ${nt} topics, ${ng} goals.`;
}

function parseQuick(text){const k=dkey();const out=[];

});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.dataset.act==='tstat'){const s=subById(t.dataset.s),tp=topById(s,t.dataset.id);tp.status=t.value;if(tp.status!=='new'&&!tp.next)tp.next=addDays(dkey(),1);if(tp.status==='new'){tp.next=null;tp.reviews=0}save();return}
 if(t.dataset.act==='skin'){S.skin=t.value;save();render();return}
 if(t.dataset.act==='libadd'&&t.value){const c=catById(t.dataset.id);let s=t.value==='__new'?null:subById(t.value);if(!s){s={id:uid(),name:c.subject,score:null,sources:'',topics:[]};const ex=S.subjects.find(x=>x.name===c.subject);if(ex)s=ex;else S.subjects.push(s)}
  if(!(s.sources||'').includes(c.title))s.sources=[s.sources,c.title].filter(Boolean).join(', ');save();toast('Added to chest',`${c.title} → ${s.name}`,'',IC.chest(28));render();return}
 if(['lq','ls','lt','lc','lo'].includes(t.id)){LIBF={q:$('#lq').value,subj:$('#ls').value,type:$('#lt').value,cost:$('#lc').value,sort:$('#lo').value};render()}
});
document.addEventListener('keydown',e=>{
 if(e.key==='Enter'&&document.activeElement&&document.activeElement.id==='chatIn'){const i=$('#chatIn');const t=i.value;i.value='';chatSend(t);return}
 if(e.key==='Enter'&&document.activeElement&&document.activeElement.id==='lq'){LIBF.q=$('#lq').value;render();setTimeout(()=>{const q=$('#lq');if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length)}},0);return}
 if(e.key==='Enter'&&!e.shiftKey&&document.activeElement&&document.activeElement.id==='fin'){e.preventDefault();const i=$('#fin');const t=i.value;i.value='';flowSend(t,VIEW!=='flow');return}
 if(e.key==='Enter'&&document.activeElement&&document.activeElement.id==='nq'){searchNotion();return}
 if(e.key==='Escape'&&$('#modal').innerHTML){closeModal();return}
 if(!S||$('#modal').innerHTML||/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))return;
 const n=+e.key;if(n>=1&&n<=VIEWS.length){VIEW=VIEWS[n-1][0];render()}
});
// pixel tooltips
let tipEl=null;
document.addEventListener('mouseover',e=>{const t=e.target.closest('[data-tip]');if(!t){if(tipEl){tipEl.remove();tipEl=null}return}if(!tipEl){tipEl=document.createElement('div');tipEl.className='tip';document.body.appendChild(tipEl)}tipEl.textContent=t.dataset.tip});
document.addEventListener('mousemove',e=>{if(tipEl){tipEl.style.left=Math.min(innerWidth-290,e.clientX+14)+'px';tipEl.style.top=(e.clientY+16)+'px'}});

/* ================= ticker ================= */
let lastDay=dkey(),lastSky=0;
setInterval(()=>{
 if(Date.now()-lastSky>60000){lastSky=Date.now();applySky()}
 if(!S)return;
 if(S.active){const [t]=findTask(S.active.id);const el=$('#tbig');if(el&&t){const sp=spentOf(t);el.textContent=fmtDur(sp);const p=$('#tprog');if(p)p.style.width=clamp(sp/6e4/t.mins*100,0,100)+'%'}document.title=(t?fmtDur(spentOf(t))+' · ':'')+'FlowCraft'}else document.title='FlowCraft';
 if(S.brk){const left=S.brk.until-Date.now();const el=$('#bbig');if(left<=0){S.brk=null;save();beep(SND.start);toast('Break over','Back to the quests!','',IC.cushion(28));if(VIEW==='quests')render()}else if(el)el.textContent=fmtDur(left)}
 if(dkey()!==lastDay){lastDay=dkey();rollDay();render();return}
 const d=today();if(!d)return;const nm=nowMin();
 d.tasks.forEach(t=>{if(t.status==='todo'&&t.slot!=null&&nm>=t.slot&&nm<t.slot+15&&!t.reminded&&!S.active){t.reminded=true;beep(SND.start);toast('Quest time!',`${t.title} - ${t.mins} min. Press Start when you begin.`,'',IC.bell?IC.bell(28):'');save()}});
},1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S&&S.active)render()});

/* ================= boot ================= */
applyTheme();initDict();
(async()=>{try{S=migrate(await loadStore())}catch(e){S=null}if(S){applyTheme();rollDay()}render()})();
}
</script></body></html>
